version: 2
updates:
  # Suivi automatique et correctifs de sécurité pour les packages npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "fix(deps)"

  # Suivi automatique des actions GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "actions"
      - "security"
    commit-message:
      prefix: "chore(ci)"
