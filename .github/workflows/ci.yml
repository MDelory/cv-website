name: CI / Security, Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Scan de sécurité automatique hebdomadaire (chaque lundi à 4h00 UTC)
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high

  codeql-analysis:
    name: CodeQL Static Security Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL for JavaScript/JSX
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL Security Scan
        uses: github/codeql-action/analyze@v3

  build-and-test:
    name: Build, Lint & Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage check (>=80%)
        run: npm run test:coverage

      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

      - name: Build project production bundle
        run: npm run build

